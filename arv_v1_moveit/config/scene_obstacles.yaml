# =============================================================================
# 赛场障碍物场景配置 (MoveIt + MuJoCo 共用)
#
# type 类型:
#   - "box"      : dimensions [x, y, z] (长宽高, 单位:米)
#   - "cylinder" : dimensions [height, radius]
#   - "sphere"   : dimensions [radius]
#   - "urdf"     : urdf_path (package:// URI), mesh由URDF内部引用
#
# graspable: true 时该物体可被夹持 (MuJoCo加freejoint, MoveIt支持attach)
#
# position: [x, y, z]    相对于 world 坐标系
# orientation_rpy: [roll, pitch, yaw]  可选, 默认 [0,0,0]
# =============================================================================

scene_manager:
  ros__parameters:
    reference_frame: "world"
    auto_load: true

    # --- 磁力吸引参数 ---
    # 物理模型: 套筒轴向磁吸 (等效永磁铁沿棍子轴向吸附能量单元)
    # magnet_force_N   : 轴向恒力 = mg(≈4.4N) + 取出额外力(10N) = 14.4N
    # magnet_detach_dist: 沿轴向脱离阈值(m), 超过后磁力永久归零
    # magnet_radial_kp : 径向定心弹簧刚度(N/m), 代替套筒内壁接触, 建议50~100
    magnet_force_N: 14.4
    magnet_detach_dist: 0.15
    magnet_radial_kp: 50.0

    obstacle_ids: ["ground_plane", "ore_frame", "energy_core_0", "energy_core_1", "energy_core_2", "energy_core_3", "energy_core_4", "energy_core_5"]

    obstacles:
      # --- 地面 ---
      ground_plane:
        type: "box"
        position: [0.0, 0.0, -0.005]
        orientation_rpy: [0.0, 0.0, 0.0]
        dimensions: [3.0, 3.0, 0.01]
        graspable: false

      # --- 取矿框架 (六边形+6棒子, SW-URDF整体导出, 固定) ---
      # STL包围盒(body内): X[-1.99,0.15] Y[-0.96,2.02] Z[0,1.62] (经RPY旋转)
      ore_frame:
        type: "urdf"
        position: [0.3, 0.0, 0.0]
        orientation_rpy: [0.0, 0.0, 0.0]
        urdf_path: "package://arv_v1_model/urdf/obstacles/ore_frame.urdf"
        graspable: false
        # 虚拟碰撞体: 手动建模替代STL凸包 (MuJoCo侧)
        # position 相对于 ore_frame body 原点, dimensions 为全尺寸
        # rgba 半透明用于调试可视化, 可选
        collision_shapes:
          # 六边形竖立于XZ平面, 绕Y轴拉伸(深度D沿Y轴)
          # 3个box绕Y轴旋转0°/60°/120°覆盖整个六边形截面
          - type: "box"
            position: [0.05, 0, 0.7]           # 六棱柱中心 (Z=高度)
            orientation_rpy: [0.0, 0.0, 0.0]
            dimensions: [0.15, 0.086602540378, 0.15]  
            rgba: [0.0, 1.0, 0.0, 0.2]

          - type: "box"
            position: [0.05, 0, 0.7]
            orientation_rpy: [1.047197551196598, 0.0, 0.0]   # 60° 绕X轴 = π/3
            dimensions: [0.15, 0.086602540378, 0.15]  
            rgba: [0.0, 1.0, 0.0, 0.2]

          - type: "box"
            position: [0.05, 0, 0.7]
            orientation_rpy: [2.094395102393195, 0.0, 0.0]   # 120° 绕X轴 = 2π/3
            dimensions: [0.15, 0.086602540378, 0.15]
            rgba: [0.0, 1.0, 0.0, 0.2]

          # === 6根外伸圆柱: 轴在YZ平面内, 整体绕X轴顺时针旋转90° ===
          # apothem r=0.075m, 杆长L=0.075m → 圆心距=0.075+0.0375=0.1125m
          # Rx(+90°)后: Y=-0.1125*sinθ, Z=0.7+0.1125*cosθ  (θ从+Y轴起, 向+Z为正)
          # orientation: roll += π/2
          - type: "cylinder"
            position: [0.035, 0.0000, 0.8125]  
            orientation_rpy: [0.0, 0.0, 0.0]
            dimensions: [0.075, 0.017]            # [高度, 半径]
            rgba: [0.0, 1.0, 0.0, 0.2]

          - type: "cylinder"
            position: [0.035, -0.0974, 0.7563]  
            orientation_rpy: [1.0471975511965974, 0.0, 0.0]
            dimensions: [0.075, 0.017]
            rgba: [0.0, 1.0, 0.0, 0.2]

          - type: "cylinder"
            position: [0.035, -0.0974, 0.6438] 
            orientation_rpy: [2.094395102393195, 0.0, 0.0]
            dimensions: [0.075, 0.017]
            rgba: [0.0, 1.0, 0.0, 0.2]

          - type: "cylinder"
            position: [0.035, 0.0000, 0.5875] 
            orientation_rpy: [0.0, 0.0, 0.0]
            dimensions: [0.075, 0.017]
            rgba: [0.0, 1.0, 0.0, 0.2]

          - type: "cylinder"
            position: [0.035, 0.0974, 0.6438] 
            orientation_rpy: [1.047197551196598, 0.0, 0.0]
            dimensions: [0.075, 0.017]
            rgba: [0.0, 1.0, 0.0, 0.2]

          - type: "cylinder"
            position: [0.035, 0.0974, 0.7563]
            orientation_rpy: [2.094395102393195, 0.0, 0.0]
            dimensions: [0.075, 0.017]
            rgba: [0.0, 1.0, 0.0, 0.2]

      # --- 能量单元 × 6 (放置在 ore_frame 的6根棒子顶端, graspable) ---
      # energy_core URDF: 质心Y=0.078m, 圆柱形, 直径~0.1m 高~0.155m
      # 碰撞体: 单个圆柱包裹, dimensions [高度, 半径]
      # 棒子位置复用 ore_frame collision_shapes 中6根cylinder的世界坐标
