# 级联P+PI控制器参数 | 修改后执行 ./reload_params.sh 热重载
# PD转Cascade: vel_Kp≈Kd_single, pos_Kp≈Kp_single/vel_Kp, vel_Ki从0.1*vel_Kp起调

/torque_controller_action_server:
  ros__parameters:
    # ========== 卡尔曼滤波器（速度滤波，降低噪声）==========
    kalman:
      enabled: true
      Q_pos: 1.0e-5    # 过程噪声：位置
      Q_vel: 1.0e-4    # 过程噪声：速度
      R_pos: 1.0e-3    # 测量噪声：位置
      R_vel: 2.5e-2    # 测量噪声：速度

    # 级联P+PI: 外环P(位置→速度), 内环PI(速度→力矩)
    cascade_pid:
      joint_1:
        # 外环（位置）：P + 条件积分 (anti-windup clamp)
        pos_Kp: 4.0
        pos_Ki: 0.3    # 位置积分：消除稳态误差，2-10s收敛
        pos_Kd: 0.0
        max_integral_pos: 2.0  # 积分限幅 → 最大积分力矩 0.3×2=0.6 Nm
        # 内环（速度）：PI
        vel_Kp: 7.0
        vel_Ki: 0.5
        vel_Kd: 0.0
        vel_limit: 10.0

      joint_2:
        pos_Kp: 6.0
        pos_Ki: 0.3
        pos_Kd: 0.0
        max_integral_pos: 2.0  # 最大积分力矩 0.6 Nm
        vel_Kp: 7.0
        vel_Ki: 0.5
        vel_Kd: 0.0
        vel_limit: 10.0

      joint_3:
        pos_Kp: 4.0
        pos_Ki: 0.3    # 链条摩擦靠积分缓慢消除
        pos_Kd: 0.0
        max_integral_pos: 2.0  # 最大积分力矩 0.6 Nm
        vel_Kp: 6.0
        vel_Ki: 0.5
        vel_Kd: 0.0
        vel_limit: 10.0

      joint_4:
        pos_Kp: 1.5
        pos_Ki: 0.2
        pos_Kd: 0.0
        max_integral_pos: 0.3  # 最大积分力矩 0.06 Nm (effort limit 1.2)
        vel_Kp: 6.3
        vel_Ki: 0.3
        vel_Kd: 0.0
        vel_limit: 10.0

      joint_5:
        pos_Kp: 1.5
        pos_Ki: 0.2
        pos_Kd: 0.0
        max_integral_pos: 0.5  # 最大积分力矩 0.1 Nm (effort limit 7)
        vel_Kp: 1.0
        vel_Ki: 0.1
        vel_Kd: 0.0
        vel_limit: 10.0

      joint_6:
        pos_Kp: 1.00
        pos_Ki: 0.15
        pos_Kd: 0.0
        max_integral_pos: 0.3  # 最大积分力矩 0.045 Nm (effort limit 1)
        vel_Kp: 1.0
        vel_Ki: 0.1
        vel_Kd: 0.0
        vel_limit: 10.0

    # ========== Safety Parameters ==========
    safety:
      # 单关节力矩/力限制, 设-1使用URDF值
      # 臂关节(revolute): Nm, 夹爪(prismatic): N
      # 策略：使用URDF标称值的80-90%作为工作限制，平衡性能和安全
      max_torque_per_joint:
        joint_1: 40.0   
        joint_2: 40.0   
        joint_3: 40.0   
        joint_4: 1.2   
        joint_5: 7.0   
        joint_6: 1.0
        joint_gripper1: 70.0  # 夹爪力限幅 (N, prismatic joint: 电机7Nm/0.05m臂/2爪=70N peak)

      # Global fallback if neither config nor URDF specified
      max_torque_default: 20.0              # Nm - conservative default

      joint_state_timeout_ms: 100     # Max time without sensor update before emergency stop
      max_control_period_ms: 10       # Detect slow control loop (200Hz = 5ms nominal)
      max_velocity_sanity: 20.0       # rad/s - reject sensor glitches (20 rad/s = ~1910 RPM)
      max_position_error: 0.8         # rad - emergency stop threshold for position tracking error

    # ========== 载荷重力补偿: τ_payload = J(q)^T × [0,0,-mg,0,0,0] ==========
    payload:
      enabled: false                    # 总开关 (运行时可 ros2 param set 切换)
      mass: 0.447                       # 载荷质量 (kg), energy_core = 0.447
      gripper_force_threshold: 0.5      # N, 夹力>此值才判定抓取
      gripper_pos_threshold: 0.01       # m, 夹爪位置>10mm才判定有物体 (空夹≈0)
