# 力矩控制器参数配置文件
# 使用方法: 修改后执行 ./reload_params.sh 热重载到运行中的节点

/torque_controller_action_server:
  ros__parameters:
    # ========== PD 增益 ==========
    Kp:
      joint_1: 30.0
      joint_2: 50.0
      joint_3: 30.0
      joint_4: 10.0
      joint_5: 1.0
      joint_6: 1.0
    Kd:
      joint_1: 1.0
      joint_2: 1.0
      joint_3: 1.0
      joint_4: 0.3
      joint_5: 1.0
      joint_6: 1.0

    # ========== 卡尔曼滤波器 ==========
    kalman:
      enabled: true
      Q_pos: 1.0e-5    # 过程噪声：位置
      Q_vel: 1.0e-4    # 过程噪声：速度
      R_pos: 1.0e-3    # 测量噪声：位置
      R_vel: 2.5e-2    # 测量噪声：速度

    # ========== 级联PID控制器 ==========
    use_cascade_pid: false

    cascade_pid:
      joint_1:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_2:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_3:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_4:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_5:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_6:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
