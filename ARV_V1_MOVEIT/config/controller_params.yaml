# 力矩控制器参数配置文件
# 使用方法: 修改后执行 ./reload_params.sh 热重载到运行中的节点

/torque_controller_action_server:
  ros__parameters:
    # ========== PD 增益 ==========
    Kp:
      joint_1: 30.0
      joint_2: 50.0
      joint_3: 30.0
      joint_4: 10.0
      joint_5: 1.0
      joint_6: 1.0
    Kd:
      joint_1: 1.0
      joint_2: 1.0
      joint_3: 1.0
      joint_4: 0.3
      joint_5: 1.0
      joint_6: 1.0

    # ========== 卡尔曼滤波器 ==========
    kalman:
      enabled: true
      Q_pos: 1.0e-5    # 过程噪声：位置
      Q_vel: 1.0e-4    # 过程噪声：速度
      R_pos: 1.0e-3    # 测量噪声：位置
      R_vel: 2.5e-2    # 测量噪声：速度

    # ========== 级联PID控制器 ==========
    use_cascade_pid: false

    cascade_pid:
      joint_1:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_2:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_3:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_4:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_5:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0
      joint_6:
        pos_Kp: 10.0
        pos_Ki: 0.0
        pos_Kd: 1.0
        vel_Kp: 50.0
        vel_Ki: 5.0
        vel_Kd: 0.0
        vel_limit: 2.0

    # ========== Safety Parameters ==========
    safety:
      # Per-joint torque limits (Nm) - Optional override of URDF effort limits
      # Set to -1 or omit to use URDF values automatically
      # Example override (uncomment to use):
      # max_torque_per_joint:
      #   joint_1: 50.0  # Override URDF value
      #   joint_2: -1    # Use URDF value (20 Nm)
      #   joint_3: -1    # Use URDF value (20 Nm)
      #   joint_4: -1    # Use URDF value (1.2 Nm - seems low!)
      #   joint_5: -1    # Use URDF value (7 Nm)
      #   joint_6: -1    # Use URDF value (1 Nm - seems low!)

      # Global fallback if neither config nor URDF specified
      max_torque_default: 20.0              # Nm - conservative default

      joint_state_timeout_ms: 100     # Max time without sensor update before emergency stop
      max_control_period_ms: 10       # Detect slow control loop (200Hz = 5ms nominal)
      max_velocity_sanity: 20.0       # rad/s - reject sensor glitches (20 rad/s = ~1910 RPM)
      max_position_error: 0.8         # rad - emergency stop threshold for position tracking error
