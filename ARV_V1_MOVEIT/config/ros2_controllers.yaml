# This config file is used by ros2_control
# ARV_V1模型的ros2_control配置 - 纯力矩控制模式

controller_manager:
  ros__parameters:
    update_rate: 200  # Hz - 控制器更新频率（匹配 torque_controller_node 的 200 Hz）

    # ========== 删除 ARM_controller ==========
    # MoveIt 将直接使用 torque_controller_node 的 Action Server
    # ARM_controller 不再需要
    
    # 力矩控制器（接收 torque_controller_node 的力矩命令）
    effort_controller:
      type: effort_controllers/JointGroupEffortController

    # 关节状态发布器（发布 Gazebo 的反馈状态）
    #joint_state_broadcaster:
     # type: joint_state_broadcaster/JointStateBroadcaster

# 力矩控制器配置
effort_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    interface_name: effort  # 使用力矩接口